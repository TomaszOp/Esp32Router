; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; samo "pio run" buduje i wgrywa (USB) tylko srodowisko glowne
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
board_build.flash_mode = qio
extra_scripts = pre:tools/web_embed.py

; Wgranie przez panel WWW (OTA): pio run -e esp32-s3-ota -t upload [--upload-port <IP>]
; Komputer w sieci AP (albo mgmt_from_sta = true). Haslo panelu: zmienna ESP32ROUTER_WEB_PASS,
; inaczej SECRET_WEB_PASS z include/Secrets.h albo pytanie w terminalu (tools/ota_upload.py).
[env:esp32-s3-ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = custom
upload_port = 192.168.4.1
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/ota_upload.py" --host $UPLOAD_PORT "$SOURCE"
